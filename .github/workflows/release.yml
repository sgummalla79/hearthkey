name: Release

# Pushing a version tag (for example v0.1.0 or v0.1.0-beta.1) builds the API image once,
# publishes it to GitHub Container Registry and Fly's registry, deploys it to staging,
# smoke-tests staging and creates a GitHub release with generated notes.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLY_APP: hearthkey-staging
  FLY_CONFIG: deploy/fly/staging.fly.toml
  DOCKERFILE: apps/api/Dockerfile
  GHCR_IMAGE: ghcr.io/${{ github.repository }}/api
  SMOKE_ATTEMPTS: 12
  SMOKE_DELAY_SECONDS: 10

jobs:
  verify:
    name: Verify tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  build:
    name: Build and publish image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          provenance: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}
            registry.fly.io/${{ env.FLY_APP }}:${{ github.ref_name }}

  deploy-staging:
    name: Deploy to staging and smoke test
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master
      - name: Deploy the image that was just built
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >
          flyctl deploy
          --config "$FLY_CONFIG"
          --app "$FLY_APP"
          --image "registry.fly.io/$FLY_APP:${{ github.ref_name }}"
      - name: Smoke test
        run: |
          url="https://${FLY_APP}.fly.dev/v1/health"
          for attempt in $(seq 1 "$SMOKE_ATTEMPTS"); do
            if curl --fail --silent --show-error "$url"; then
              echo
              echo "Staging healthy"
              exit 0
            fi
            echo "Attempt $attempt failed; retrying"
            sleep "$SMOKE_DELAY_SECONDS"
          done
          echo "Staging did not become healthy" >&2
          exit 1

  github-release:
    name: Create GitHub release
    needs: deploy-staging
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "${{ github.ref_name }}" in
            *-*) flags="--prerelease" ;;
          esac
          gh release create "${{ github.ref_name }}" --generate-notes --verify-tag $flags
