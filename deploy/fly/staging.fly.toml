# Staging API on Fly.io. Deploy from the repo root:
#   fly deploy --config deploy/fly/staging.fly.toml --dockerfile apps/api/Dockerfile
# Secrets (database URL, etc.) are set with `fly secrets set` and never stored here.
# Staging holds fake data only.
app = "hearthkey-staging"
# primary_region is chosen when the app is created (`fly apps create`/`fly launch`).

[build]

[env]
  HEARTHKEY_API_HOST = "0.0.0.0"
  HEARTHKEY_API_PORT = "3000"
  HEARTHKEY_REQUEST_BODY_LIMIT_BYTES = "1048576"
  HEARTHKEY_PAGE_SIZE_MAX = "100"
  HEARTHKEY_LOG_LEVEL = "info"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/v1/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
