# Local development stack. Usage:
#   cp deploy/local/local.env.example deploy/local/local.env
#   docker compose --env-file deploy/local/local.env -f deploy/local/docker-compose.yml up --build
# All values come from the env file; nothing is hardcoded here.
name: hearthkey-local

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HEARTHKEY_API_HOST: ${HEARTHKEY_API_HOST}
      HEARTHKEY_API_PORT: ${HEARTHKEY_API_PORT}
      HEARTHKEY_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HEARTHKEY_REQUEST_BODY_LIMIT_BYTES: ${HEARTHKEY_REQUEST_BODY_LIMIT_BYTES}
      HEARTHKEY_PAGE_SIZE_MAX: ${HEARTHKEY_PAGE_SIZE_MAX}
      HEARTHKEY_LOG_LEVEL: ${HEARTHKEY_LOG_LEVEL}
    ports:
      - '127.0.0.1:${HEARTHKEY_API_HOST_PORT}:${HEARTHKEY_API_PORT}'

volumes:
  postgres-data:
